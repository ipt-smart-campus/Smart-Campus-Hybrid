services:

  context-provider:
    image: nginx:alpine
    hostname: context
    container_name: sc-context-provider
    volumes:
      - ./context:/usr/share/nginx/html:ro
    ports:
      - "3004:80"
    networks:
      - smart-campus

  mongo-db:
    image: mongo:4.4
    hostname: mongo-db
    container_name: sc-mongo-db
    command: --nojournal
    ports:
      - "27017:27017"
    volumes:
      - mongo-db-data:/data/db
    networks:
      - smart-campus
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  orion:
    image: fiware/orion-ld
    hostname: orion
    container_name: sc-orion
    depends_on:
      - mongo-db
    expose:
      - "1026"
    ports:
      - "1026:1026"
    command: -dbhost mongo-db -logLevel DEBUG
    networks:
      - smart-campus
    healthcheck:
      test: curl --fail -s http://orion:1026/version || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    hostname: mosquitto
    container_name: sc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./iot-agent/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - smart-campus

  iot-agent:
    image: fiware/iotagent-json
    hostname: iot-agent
    container_name: sc-iot-agent
    depends_on:
      - mongo-db
      - orion
      - mosquitto
      - context-provider
    expose:
      - "4041"
      - "7896"
    ports:
      - "4041:4041"
      - "7896:7896"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_NORTH_PORT=4041
      - IOTA_HTTP_PORT=7896
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_URI=mongodb://mongo-db:27017/iotagentjson
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_JSON_LD_CONTEXT=http://context/campus-context.jsonld
      - IOTA_FALLBACK_TENANT=openiot
      - IOTA_AUTOCAST=true
      - IOTA_LOG_LEVEL=DEBUG
    networks:
      - smart-campus

  draco:
    image: ging/fiware-draco:2.1.0
    hostname: draco
    container_name: sc-draco
    environment:
      - NIFI_WEB_HTTPS_PORT=9090
      - NIFI_WEB_PROXY_HOST=localhost:9090,draco:9090
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=pass1234567890
    ports:
      - "9090:9090"   # UI do NiFi -> https://localhost:9090/nifi
      - "5050:5050"   # ListenHTTP escuta as notificações do Orion aqui
    volumes:
      - draco-conf:/opt/nifi/nifi-current/conf
      - draco-content-repository:/opt/nifi/nifi-current/content_repository
      - draco-database-repository:/opt/nifi/nifi-current/database_repository
      - draco-flowfile-repository:/opt/nifi/nifi-current/flowfile_repository
      - draco-provenance-repository:/opt/nifi/nifi-current/provenance_repository
      - draco-state:/opt/nifi/nifi-current/state
      - draco-logs:/opt/nifi/nifi-current/logs
    networks:
      - smart-campus

  kafka:
    image: apache/kafka:3.7.0
    container_name: sc-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - smart-campus

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: sc-kafka-ui
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - smart-campus

  billing:
    build: ./microservices
    hostname: billing
    container_name: sc-billing
    command: ["python", "-u", "-m", "billing.main"]
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=context.device
    depends_on:
      - kafka
    volumes:
      - billing-data:/app/data
    networks:
      - smart-campus

  analytics:
    build: ./microservices
    hostname: analytics
    container_name: sc-analytics
    command: ["python", "-u", "-m", "analytics.main"]
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=context.device
    depends_on:
      - kafka
    volumes:
      - analytics-data:/app/data
    networks:
      - smart-campus

  notifications:
    build: ./microservices
    hostname: notifications
    container_name: sc-notifications
    command: ["python", "-u", "-m", "notifications.main"]
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=context.device
    depends_on:
      - kafka
    volumes:
      - notifications-data:/app/data
    networks:
      - smart-campus

networks:
  smart-campus:
    driver: bridge

volumes:
  mongo-db-data: ~
  billing-data: ~
  analytics-data: ~
  notifications-data: ~
  draco-conf: ~
  draco-content-repository: ~
  draco-database-repository: ~
  draco-flowfile-repository: ~
  draco-provenance-repository: ~
  draco-state: ~
  draco-logs: ~